name: Download Midishow MIDIs

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: '起始页码 (Start Page)'
        required: false
        default: '1'
        type: string
      max_page:
        description: '结束页码 (Max Page)'
        required: false
        default: '500000'
        type: string
      push_interval:
        description: '每隔多少页保存并推送到仓库 (Push Interval)'
        required: false
        default: '10'
        type: string
      cookie:
        description: '自定义 Cookie (留空则优先使用 Secrets.MIDISHOW_COOKIE 或脚本默认值)'
        required: false
        default: ''
        type: string

# 授予工作流向当前仓库提交与推送代码的权限
permissions:
  contents: write

jobs:
  download-midi:
    name: Crawl & Save MIDIs
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 最长允许运行 6 小时

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装 Playwright 与浏览器依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: 4. 执行自动抓取与分段保存
        env:
          START_PAGE: ${{ github.event.inputs.start_page || '1' }}
          MAX_PAGE: ${{ github.event.inputs.max_page || '500000' }}
          PUSH_INTERVAL: ${{ github.event.inputs.push_interval || '10' }}
          MIDISHOW_COOKIE: ${{ github.event.inputs.cookie || secrets.MIDISHOW_COOKIE }}
          HEADLESS: 'true'
          AUTO_GIT_PUSH: 'true'
        run: |
          python midishow/downmidi.py

      - name: 5. 兜底保存未提交的 MIDI 文件与日志
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add midi_downloads/ downloaded_success.txt downloaded_failed.txt || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: 兜底提交未保存的 MIDI 成果与日志 [skip ci]"
            git pull --rebase || true
            git push || true
          fi

      - name: 6. 上传 Artifacts 备份附件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midishow-downloads-backup
          path: |
            midi_downloads/
            downloaded_success.txt
            downloaded_failed.txt
          if-no-files-found: ignore
          retention-days: 30
