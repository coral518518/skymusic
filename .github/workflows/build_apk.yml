name: Build SkyMusic Android APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release 版本号/Tag (例如 v1.0.1，留空则默认按运行序号 v1.0.<RunID>)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release 标题 (留空则默认使用版本名称)'
        required: false
        default: ''
        type: string

# 授予创建与更新 GitHub Releases 的写入权限
permissions:
  contents: write

jobs:
  build:
    name: Compile and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 接受 Android SDK 许可
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. 配置 Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: 5. 编译生成 Android Debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "开始打包光遇自动弹琴 App..."
          gradle assembleDebug --stacktrace
          # 复制并重命名为友好的安装包名称
          cp app/build/outputs/apk/debug/app-debug.apk ./SkyMusic-v1.0.apk
          ls -la ./SkyMusic-v1.0.apk

      - name: 6. 上传备份至 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyMusic-v1.0-debug
          path: ./SkyMusic-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: 7. 解析发布版本号与标题
        id: release_info
        run: |
          VERSION="${{ inputs.version_tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="v1.0.${{ github.run_number }}"
          fi
          TITLE="${{ inputs.release_title }}"
          if [ -z "$TITLE" ]; then
            TITLE="SkyMusic 琴灵 $VERSION"
          fi
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: 8. 发布并上传至 GitHub Releases (免解压直接下载)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## ✨ SkyMusic 光遇自动弹琴助手 APK 已发布！

            ### 📱 安装包直链下载
            在下方 **Assets** 列表中点击 **`SkyMusic-v1.0.apk`** 即可直接下载到手机安装（无需解压）。

            ### 🌟 本次更新亮点
            - 🔐 **固定专属签名（解决每次都要卸载的问题）**：已配置永久固定签名密钥，今后所有版本支持直接覆盖安装，绝不再提示签名冲突！
            - ⚡ **支持 Root 模式授权（防游戏检测）**：完美支持 Android 15 下 KernelSU / APatch / Magisk，通过底层 su 注入点击，免开系统无障碍，更安全防封号！
            - 🎯 **校准默认位置重构**：默认琴键位置与大小已根据实测调整（往左5微调、往上20微调、放大3级），初始位置更贴合！
            - 🎲 **按键随机延迟抖动 (ms范围设置)**：悬浮窗支持切换 0ms / ±5ms / ±10ms / ±20ms / ±30ms 间隔随机抖动，打破机械节奏，全面防检测！
            - 🎹 **和弦并发触控 & 范围微偏移**：多音和弦并发敲击，按键真实范围圈内随机微偏移，模拟真人手指自然弹奏。
            - 📂 **全格式乐谱导入**：MIDI (.mid) 文件、Sky Studio JSON 乐谱、纯文本简谱直接导入即弹。

            *由 GitHub Actions 云端全自动编译生成。*
          files: |
            ./SkyMusic-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
