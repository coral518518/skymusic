name: Build SkyMusic Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 接受 Android SDK 许可
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. 配置 Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: 5. 编译生成 Android Debug APK
        run: |
          echo "开始打包光遇自动弹琴 App..."
          gradle assembleDebug --stacktrace
          ls -la app/build/outputs/apk/debug/

      - name: 6. 上传 APK 安装包至 GitHub 附件
        uses: actions/upload-artifact@v4
        with:
          name: SkyMusic-v1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
