name: Build SkyMusic Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮一键打包

jobs:
  build:
    name: Compile and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17 开发环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708 # 最新 stable 命令行工具

      - name: 4. 配置 Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: 5. 编译生成 Android Debug APK
        run: |
          echo "开始打包光遇自动弹琴 App..."
          gradle assembleDebug --stacktrace
          ls -la app/build/outputs/apk/debug/

      - name: 6. 上传 APK 安装包至 GitHub 附件
        uses: actions/upload-artifact@v4
        with:
          name: SkyMusic-v1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
