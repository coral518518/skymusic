name: 抓取音游伴侣乐谱与简谱 (Scrape MGM Scores)

on:
  workflow_dispatch:
    inputs:
      max_count:
        description: '抓取乐谱数量 (Max Count)'
        required: false
        default: '100'
        type: string
      rate_per_minute:
        description: '抓取速率 (个/分钟，防封禁限流)'
        required: false
        default: '5'
        type: string
      start_page:
        description: '起始页码 (Start Page)'
        required: false
        default: '1'
        type: string
      username:
        description: '音游伴侣账号 (默认 lollol，留空可使用 Secrets.MGM_USERNAME)'
        required: false
        default: 'lollol'
        type: string
      password:
        description: '音游伴侣密码 (默认 123456，留空可使用 Secrets.MGM_PASSWORD)'
        required: false
        default: '123456'
        type: string
      save_dir:
        description: '保存目录 (Save Directory)'
        required: false
        default: '音游伴侣/scores'
        type: string

  # 如需定时自动增量抓取，可取消注释下列 schedule：
  # schedule:
  #   - cron: '0 2 * * *' # 每天北京时间 10:00 自动抓取增量

# 授予工作流向当前仓库提交并推送代码的权限
permissions:
  contents: write

jobs:
  scrape-and-archive:
    name: 虚拟显示器抓取乐谱并自动提交
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 最长允许运行 6 小时

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装 Playwright 与 Xvfb 虚拟显示器
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Setup V2rayN Node (Failover Enabled)
        env:
            # 注意：现在需要传入一个包含多个配置的 JSON 数组
          XRAY_CONFIGS: ${{ secrets.XRAY_CONFIGS }}
        run: |
          MAX_RETRIES=10
          RETRY_DELAY=10
          DOWNLOAD_SUCCESS=false

          for ((j=1; j<=MAX_RETRIES; j++)); do
            echo "⬇️ Fetching latest Xray-core (尝试 $j/$MAX_RETRIES)..."
            VERSION=$(curl -fsSL "https://d1.coral001.de5.net/common_data/kvselect/githubxray" 2>/dev/null | tr -d '\r\n')
            [ -z "$VERSION" ] && VERSION="v26.1.18"
            echo "📌 使用版本号: $VERSION"
            
            if [ -n "$VERSION" ]; then
              echo "📌 成功获取版本号: $VERSION"
              DOWNLOAD_URL="https://github.com/XTLS/Xray-core/releases/download/${VERSION}/Xray-linux-64.zip"          
              
              echo "⬇️ 开始下载压缩包..."
              curl -sL -o xray.zip "$DOWNLOAD_URL"
              
              if unzip -qo xray.zip -d xray_folder; then
                chmod +x ./xray_folder/xray
                echo "✅ Xray-core 下载并解压成功！"
                DOWNLOAD_SUCCESS=true
                break
              else
                echo "⚠️ 解压失败 (文件可能已损坏或遭遇 API 限制)。清理并准备重试..."
                rm -f xray.zip
                rm -rf xray_folder
              fi
            else
              echo "⚠️ 未能获取到版本号 (可能触发了 GitHub 接口频率限制)。"
            fi
            
            echo "⏳ 等待 $RETRY_DELAY 秒后进行下一次尝试..."
            sleep $RETRY_DELAY
          done

          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "❌ 致命错误：重试 $MAX_RETRIES 次后依然无法下载并配置 Xray-core！"
            exit 1
          fi
          # ====================================================

          TMP_CONFIGS=$(curl -fsSL "https://d1.coral001.de5.net/common_data/kvselect/githubvry" 2>/dev/null)
          [ -n "$TMP_CONFIGS" ] && XRAY_CONFIGS="$TMP_CONFIGS"
          CONFIG_COUNT=$(echo "$XRAY_CONFIGS" | jq '. | length')
            
          if [ -z "$CONFIG_COUNT" ] || [ "$CONFIG_COUNT" -eq 0 ]; then
            echo "❌ 错误: 未能在 Secrets 中找到有效的节点配置数组！"
            exit 1
          fi

          echo "🔍 检测到 $CONFIG_COUNT 个备用节点，开始进行连通性测试..."
          SUCCESS=false
            
            # 遍历所有节点配置
          for i in $(seq 0 $(($CONFIG_COUNT - 1))); do
            echo "----------------------------------------"
            echo "⚙️ 正在测试节点配置 (索引: $i)..."
              
              # 提取当前的配置并写入 config.json
            echo "$XRAY_CONFIGS" | jq -c ".[$i]" > config.json
              
              # 清理可能残留的上一轮 Xray 进程
            pkill -f "./xray_folder/xray" || true
              
              # 后台启动 Xray
            ./xray_folder/xray -c config.json > xray.log 2>&1 &
              
            echo "⏳ 等待 5 秒让代理初始化..."
            sleep 5

            echo "🔍 检查代理进程状态..."
            ps aux | grep xray | grep -v grep || true
            ss -tlnp | grep 4066 || echo "❌ 端口 4066 未在监听！"

            echo "📋 Xray 启动日志："
            cat xray.log || true
            
            echo "📡 正在测试与 Google 的连通性..."
              # 使用 curl 测试连通性：
              # -m 10 : 最大超时时间设置为 10 秒，防止死节点导致 Action 卡住
              # -w "%{http_code}" : 仅提取 HTTP 状态码
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 -x http://127.0.0.1:4066 https://www.google.com 2>/dev/null) || HTTP_STATUS="000"
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "🎉 测试成功！节点 $i 可用，将使用此节点继续后续任务。"
              SUCCESS=true
              break
            else
              echo "⚠️ 节点 $i 连接失败 (状态码或超时: $HTTP_STATUS)。准备切换下一个..."
                # 可选：如果你想排错，可以取消下面这行的注释来查看 Xray 报错日志
                # tail -n 5 xray.log 
            fi
          done
            
          if [ "$SUCCESS" = false ]; then
            echo "❌ 致命错误：所有 $CONFIG_COUNT 个节点均不可用！Action 被终止。"
            exit 1
          fi
          
      - name: 4. 在虚拟显示器中执行自动化抓取与简谱转换
        env:
          PYTHONUNBUFFERED: '1' # 强制 Python 禁用输出缓冲区，保证 GitHub Actions 实时刷新日志
          MAX_COUNT: ${{ github.event.inputs.max_count || '100' }}
          RATE_PER_MINUTE: ${{ github.event.inputs.rate_per_minute || '5' }}
          START_PAGE: ${{ github.event.inputs.start_page || '1' }}
          MGM_USERNAME: ${{ github.event.inputs.username || secrets.MGM_USERNAME || 'lollol' }}
          MGM_PASSWORD: ${{ github.event.inputs.password || secrets.MGM_PASSWORD || '123456' }}
          SAVE_DIR: ${{ github.event.inputs.save_dir || '音游伴侣/scores' }}
          HEADLESS: 'false'
          DISPLAY: ':99'
        run: |
          # 启动 Xvfb 虚拟显示器 (1920x1080 24位色深)
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 2

          # 启动抓取主脚本 (-u 开启完全无缓冲流式标准输出)
          python -u 音游伴侣/scrape_scores.py

      - name: 5. 自动提交新抓取的乐谱与简谱到 GitHub
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add 音游伴侣/
          if git diff --staged --quiet; then
            echo "ℹ️ 本次没有新增或变动的乐谱文件，无需提交。"
          else
            git commit -m "Auto-scrape: 自动抓取并更新音游伴侣乐谱与简谱 [skip ci]"
            git pull --rebase || true
            git push || true
            echo "✅ 成功提交并推送到 GitHub 仓库！"
          fi

      - name: 6. 上传 Artifacts 备份附件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgm-scores-backup
          path: |
            音游伴侣/scores/
            音游伴侣/downloaded_ids.json
          if-no-files-found: ignore
          retention-days: 30
