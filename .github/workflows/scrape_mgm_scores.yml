name: 抓取音游伴侣乐谱与简谱 (Scrape MGM Scores)

on:
  workflow_dispatch:
    inputs:
      max_count:
        description: '抓取乐谱数量 (Max Count)'
        required: false
        default: '100'
        type: string
      rate_per_minute:
        description: '抓取速率 (个/分钟，防封禁限流)'
        required: false
        default: '5'
        type: string
      start_page:
        description: '起始页码 (Start Page)'
        required: false
        default: '1'
        type: string
      username:
        description: '音游伴侣账号 (默认 lollol，留空可使用 Secrets.MGM_USERNAME)'
        required: false
        default: 'lollol'
        type: string
      password:
        description: '音游伴侣密码 (默认 123456，留空可使用 Secrets.MGM_PASSWORD)'
        required: false
        default: '123456'
        type: string
      save_dir:
        description: '保存目录 (Save Directory)'
        required: false
        default: '音游伴侣/scores'
        type: string

  # 如需定时自动增量抓取，可取消注释下列 schedule：
  # schedule:
  #   - cron: '0 2 * * *' # 每天北京时间 10:00 自动抓取增量

# 授予工作流向当前仓库提交并推送代码的权限
permissions:
  contents: write

jobs:
  scrape-and-archive:
    name: 虚拟显示器抓取乐谱并自动提交
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 最长允许运行 6 小时

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装 Playwright 与 Xvfb 虚拟显示器
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: 4. 在虚拟显示器中执行自动化抓取与简谱转换
        env:
          MAX_COUNT: ${{ github.event.inputs.max_count || '100' }}
          RATE_PER_MINUTE: ${{ github.event.inputs.rate_per_minute || '5' }}
          START_PAGE: ${{ github.event.inputs.start_page || '1' }}
          MGM_USERNAME: ${{ github.event.inputs.username || secrets.MGM_USERNAME || 'lollol' }}
          MGM_PASSWORD: ${{ github.event.inputs.password || secrets.MGM_PASSWORD || '123456' }}
          SAVE_DIR: ${{ github.event.inputs.save_dir || '音游伴侣/scores' }}
          HEADLESS: 'false'
          DISPLAY: ':99'
        run: |
          # 启动 Xvfb 虚拟显示器 (1920x1080 24位色深)
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

          # 启动抓取主脚本
          python 音游伴侣/scrape_scores.py

      - name: 5. 自动提交新抓取的乐谱与简谱到 GitHub
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add 音游伴侣/
          if git diff --staged --quiet; then
            echo "ℹ️ 本次没有新增或变动的乐谱文件，无需提交。"
          else
            git commit -m "Auto-scrape: 自动抓取并更新音游伴侣乐谱与简谱 [skip ci]"
            git pull --rebase || true
            git push || true
            echo "✅ 成功提交并推送到 GitHub 仓库！"
          fi

      - name: 6. 上传 Artifacts 备份附件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgm-scores-backup
          path: |
            音游伴侣/scores/
            音游伴侣/downloaded_ids.json
          if-no-files-found: ignore
          retention-days: 30
